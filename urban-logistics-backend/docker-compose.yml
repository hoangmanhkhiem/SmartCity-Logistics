services:
  mysql:
    image: mysql:8.0
    container_name: urban-logistics-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-logistic}
      MYSQL_USER: ${MYSQL_USER:-urban}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-urban}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - urban-logistics-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: urban-logistics-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "5050:80"
    networks:
      - urban-logistics-network
    depends_on:
      - mysql

volumes:
  mysql_data:

networks:
  urban-logistics-network:
    driver: bridge
