services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-logistic}
      MYSQL_USER: ${DB_USER:-urban}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${DB_PASSWORD:-change-me}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: ${DOCKER_REGISTRY:-ghcr.io/hoangmanhkhiem}/smartcity-logistics-api:${IMAGE_TAG:-latest}
    pull_policy: always
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-urban}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-logistic}
      DATABASE_URL: mysql://${DB_USER:-urban}:${DB_PASSWORD:-change-me}@mysql:3306/${DB_NAME:-logistic}
      PORT: 3001
      NODE_ENV: production
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${DOCKER_REGISTRY:-ghcr.io/hoangmanhkhiem}/smartcity-logistics-web:${IMAGE_TAG:-latest}
    pull_policy: always
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BACKEND_PROXY_TARGET: http://api:3001
    environment:
      BACKEND_PROXY_TARGET: http://api:3001
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3333}:3000"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    profiles: ["gateway"]
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  mysql_data:
