# Dev stack. Chạy từ D:\SmartCity-Logistics
# api/web mỗi service: mount app riêng + node_modules volume riêng (không dùng chung)
services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-logistic}
      MYSQL_USER: ${MYSQL_USER:-urban}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-urban}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: node:20-bookworm
    working_dir: /app
    command: >
      bash -lc "npm install &&
      npm run prisma:generate &&
      npm run prisma:migrate:deploy &&
      npm run start:dev"
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-urban}
      DB_PASSWORD: ${MYSQL_PASSWORD:-urban}
      DB_NAME: ${MYSQL_DATABASE:-logistic}
      DATABASE_URL: mysql://${MYSQL_USER:-urban}:${MYSQL_PASSWORD:-urban}@mysql:3306/${MYSQL_DATABASE:-logistic}
      PORT: ${API_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      NODE_ENV: development
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: node:20-bookworm
    working_dir: /app
    command: >
      bash -lc "npm install &&
      npm run dev -- -H 0.0.0.0 -p ${WEB_PORT:-3000}"
    env_file: .env
    environment:
      BACKEND_PROXY_TARGET: http://api:${API_PORT:-3001}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_dev_data:
  api_node_modules:
  web_node_modules:
