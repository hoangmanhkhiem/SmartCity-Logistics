name: SmartCity Logistics CI/CD

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. TEST
  # ==========================================
  test:
    name: Run tests
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: change-me
          MYSQL_DATABASE: logistic_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pchange-me"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      CI: true
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: change-me
      DB_NAME: logistic_ci
      DATABASE_URL: mysql://root:change-me@127.0.0.1:3306/logistic_ci
      JWT_SECRET: ci-jwt-secret-change-me-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API
        working-directory: apps/api
        run: npm ci

      - name: Build API
        working-directory: apps/api
        run: npm run build

  # ==========================================
  # 2. BUILD & PUSH TO GHCR
  # ==========================================
  publish:
    name: Build and push GHCR images
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/hoangmanhkhiem/smartcity-logistics-api:latest
            ghcr.io/hoangmanhkhiem/smartcity-logistics-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            BACKEND_PROXY_TARGET=http://api:3001
          tags: |
            ghcr.io/hoangmanhkhiem/smartcity-logistics-web:latest
            ghcr.io/hoangmanhkhiem/smartcity-logistics-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ==========================================
  # 3. DEPLOY TO VPS
  # ==========================================
  deploy:
    name: Deploy to VPS
    needs: publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2

        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_PATH: ${{ secrets.VPS_PATH }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 20m

          envs: GHCR_USER,GHCR_TOKEN,VPS_PATH

          script: |
            set -euo pipefail

            echo "Starting deployment..."

            cd "$VPS_PATH"

            if [ -n "${GHCR_USER:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
                -u "$GHCR_USER" \
                --password-stdin
            fi

            docker compose pull api web

            docker compose up -d --no-build --remove-orphans

            docker compose ps

            echo "Deployment completed!"
