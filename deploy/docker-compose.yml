# Copy file này lên VPS: /opt/logistics/docker-compose.yml
# Chỉ pull image GHCR — không build trên máy chủ.

services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-logistic}
      MYSQL_USER: ${DB_USER:-urban}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    image: ${DOCKER_REGISTRY:-ghcr.io/hoangmanhkhiem}/smartcity-logistics-api:${IMAGE_TAG:-latest}
    pull_policy: always
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DATABASE_URL: mysql://${DB_USER:-urban}:${DB_PASSWORD}@mysql:3306/${DB_NAME:-logistic}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${DOCKER_REGISTRY:-ghcr.io/hoangmanhkhiem}/smartcity-logistics-web:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      NODE_ENV: production
      BACKEND_PROXY_TARGET: http://api:3001
    ports:
      - "${NGINX_HTTP_PORT:-80}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data:
